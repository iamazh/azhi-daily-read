<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿智的每日短读 · 今天读点有意思的</title>
<style>
  :root{
    --paper:#f6f1e6; --card:#fffdf7; --line:#e6dcc8; --ink:#3b332a; --muted:#9a8f78;
    --warm:#b0602e; --gold:#a47a2e; --blue:#3f6188; --green:#5f7d52;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Songti SC","SimSun","PingFang SC","Microsoft YaHei",serif;background:linear-gradient(180deg,#f1e9d8,#f8f3e8);color:var(--ink);min-height:100vh;padding:16px 14px 60px;}
  .app{max-width:600px;margin:0 auto;}
  .head{display:flex;align-items:center;gap:11px;margin-bottom:6px;}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--warm),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .ht{font-weight:900;font-size:19px;letter-spacing:1px;}
  .ht small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:2px;}
  .date{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;}
  .date b{color:var(--gold);font-size:14px;}
  .mood{margin:9px 0 14px;font-size:13px;color:var(--muted);line-height:1.7;font-style:italic;}
  .screen{display:none;}.screen.on{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .cards{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;transition:.15s;position:relative;}
  .card:hover{border-color:var(--warm);transform:translateY(-2px);box-shadow:0 4px 14px rgba(120,70,10,.08);}
  .card .tg{display:inline-block;font-size:11px;color:#fff;border-radius:4px;padding:2px 8px;letter-spacing:1px;margin-bottom:8px;}
  .t-home{background:var(--warm);} .t-school{background:var(--blue);} .t-love{background:#b05478;} .t-friend{background:var(--green);} .t-jx{background:#5d4a8c;} .t-life{background:#8a7a3c;}
  .card h3{font-size:17px;font-weight:900;letter-spacing:.5px;}
  .card .ti{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.7;}
  .card .ok{position:absolute;top:14px;right:14px;font-size:11px;color:var(--green);letter-spacing:1px;}
  .card.read{opacity:.72;}
  .crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .crumb .back{cursor:pointer;color:var(--gold);}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;box-shadow:0 4px 14px rgba(60,40,0,.05);}
  .sheet .tagline{font-size:12px;letter-spacing:2px;color:var(--muted);text-align:center;margin-bottom:6px;}
  .sheet h2{font-size:20px;text-align:center;letter-spacing:1px;}
  .sheet .para{font-size:16px;line-height:2.05;letter-spacing:.5px;text-align:justify;margin-top:13px;}
  .finish{display:block;width:100%;margin-top:18px;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--warm),var(--gold));color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:2px;}
  .interact{background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:18px;margin-top:14px;}
  .interact .k{font-size:12px;letter-spacing:2px;color:var(--gold);margin-bottom:10px;}
  .interact .q{font-size:15px;line-height:1.9;margin-bottom:12px;}
  .em{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:9px;transition:.12s;}
  .em:hover{border-color:var(--warm);}
  .reply{background:#f3ead6;border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.9;animation:fade .3s;}
  .reply b{color:var(--warm);}
  .readblock{font-size:13.5px;line-height:1.85;color:var(--ink);margin-top:10px;}
  .reco-card{background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:18px;margin-top:16px;}
  .reco-card .k{font-size:12px;letter-spacing:2px;color:var(--gold);margin-bottom:10px;}
  .type-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
  .type-btn{border:1px solid var(--blue);color:var(--blue);background:transparent;padding:7px 13px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;}
  .type-btn.sel{background:var(--blue);color:#fff;}
  .book{padding:9px 0;border-bottom:1px dashed var(--line);}
  .book:last-child{border:none;}
  .book .bn{font-weight:800;font-size:15px;}
  .book .bd{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.6;}
  .tip{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:6px;}
.footnote{text-align:center;color:var(--muted);font-size:11px;margin-top:24px;letter-spacing:1px;}
  /* ---- 书架：可读的书 ---- */
  .bcover{width:118px;border-radius:10px;padding:14px 12px;color:#fff;cursor:pointer;position:relative;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 5px 14px rgba(40,30,0,.18);transition:.15s;border:1px solid rgba(255,255,255,.25);}
  .bcover:hover{transform:translateY(-3px);}
  .bcover .bt{font-weight:900;font-size:15px;line-height:1.45;}
  .bcover .au{font-size:11px;opacity:.9;margin-top:5px;}
  .bcover .ab{font-size:10.5px;opacity:.95;background:rgba(0,0,0,.24);border-radius:4px;padding:2px 6px;align-self:flex-start;}
  /* ---- 书阅读页 ---- */
  .toc-btn{border:2px solid var(--gold);color:var(--gold);background:transparent;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:auto;}
  .readshell{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;box-shadow:0 4px 14px rgba(60,40,0,.05);}
  .readshell .rk{font-size:13px;letter-spacing:1px;color:var(--muted);}
  .readshell h2{font-size:19px;text-align:center;letter-spacing:1px;margin:4px 0 2px;}
  .readshell .au2{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px;}
  .readshell .para{font-size:16px;line-height:2.05;letter-spacing:.5px;text-align:justify;}
  .readshell .para + .para{margin-top:12px;}
  .tocBox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;}
  .toc-item{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer;font-size:14px;}
  .toc-item:last-child{border:none;}
  .toc-item.cur{color:var(--warm);font-weight:800;}
  .toc-item .p{font-size:11px;color:var(--muted);}
  .navbtn{flex:1;padding:11px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:700;}
  .navbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);}
  .navbtn.gold{background:linear-gradient(135deg,var(--warm),var(--gold));color:#fff;}
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <div class="logo">📖</div>
    <div class="ht">阿智的每日短读<small>今天，随手读两篇</small></div>
    <div class="date"><b id="dateTxt">--</b><br><span id="doneChip"></span></div>
  </div>
  <div class="mood">读得开心就好，读不完也没关系。这只是一个，给今天的你开的小窗。</div>

  <!-- 今日列表 -->
  <div class="screen on" id="s-list">
    <div class="cards" id="todayCards"></div>
<div id="footprint" style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;"></div>
    <div class="reco-card" style="margin-top:12px;">
      <div class="k">📚 我的书架 · 我关注的书</div>
      <div id="shelfBox"></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <input id="shelfInput" type="text" placeholder="输入书名，回车或点添加（例：哈利·波特）" onkeydown="if(event.key==='Enter')addShelfBook()" style="flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);">
        <button class="type-btn" onclick="addShelfBook()" style="flex:none;background:var(--gold);border-color:var(--gold);color:#fff;padding:10px 16px;">添加</button>
      </div>
      <div class="tip" style="margin-top:6px;">想读的、正在读的书都放进来；读完或不想读了，点书旁边的删除就行。</div>
      <div style="margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;">
        <div class="k">✨ 可读的书 · 点开就能读（有目录，自动记进度）</div>
        <div id="readableGrid" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;"></div>
      </div>
    </div>
<div class="reco-card" style="margin-top:16px;">
      <div class="k">🌙 今晚，还想读点别的吗？</div>
      <div class="type-row" id="typeRow"></div>
      <div style="display:flex;gap:8px;margin:12px 0 4px;">
        <input id="prefInput" type="text" placeholder="直接输入你喜欢的书名或类型（例：冒险 / 科幻 / 温暖 / 悬疑 / 哈利）" onkeydown="if(event.key==='Enter')recoByInput()" style="flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);">
        <button class="type-btn" onclick="recoByInput()" style="flex:none;background:var(--gold);border-color:var(--gold);color:#fff;padding:10px 16px;">推荐</button>
      </div>
      <div id="bookBox"><div class="tip">点一个类型，或在上面输入框里写你喜欢的书/题材，我替你挑书，还会把你的口味记下来。</div></div>
    </div>
  </div>

  <!-- 阅读+互动 -->
  <div class="screen" id="s-read">
    <div class="crumb"><span class="back" onclick="backToList()">← 今日</span><span id="crumbTag"></span></div>
<div class="sheet" id="sheet"></div>
    <div id="interactBox"></div>
  </div>

  <!-- 书阅读页 -->
  <div class="screen" id="s-reading">
    <div class="crumb"><span class="back" onclick="backToList()">← 书架</span><span id="readTitle"></span><button class="toc-btn" onclick="toggleToc()">目录</button></div>
    <div class="readshell" id="readshell"></div>
    <div class="tocBox" id="tocBox" style="display:none;"></div>
    <div class="turn" id="readNav" style="margin-top:14px;"></div>
  </div>

  <div class="footnote">每日短读 · 只负责让你多看见一点世界</div>
</div>

<script>/* ============ 每日短读 · 内容库 ============
   想更新文章，直接改这个文件里的数组即可：
   1. 新增一组（某一天）就再加一个 [ {…},{…},{…} ]；
   2. 保存后，手机/浏览器刷新页面就会看到新内容。
   结构：tag 主题 / tg 颜色 / emo 图标 / title 标题 / intro 引子 / paras 正文段 / q 情感问题 / opts 情绪选项(每项一个回应) / read 精简解读 */
window.DAILY_CONTENT = [
  /* —— 第 1 天 —— */
  [
    {tag:"家国",tg:"t-home",emo:"🏔️",title:"雪线之上",
      intro:"一个边防军人的儿子，在雪山和老家之间，第一次读懂“守国门”三个字。",
      paras:["那年我们家的年，是在视频里过的。我爸在帕米尔高原的一座哨所，海拔四千米，雪把月亮压到三月底。他一年只回来一两回，视频信号断断续续，声音像被风切成了好几段。",
        "芒果干是托人从山那边捎来的，他说是“顺手带的”。我偷偷翻过那盒芒果干，下面压着他留档的调令——他本有机会调回老家，是自己没递上去。我问为什么，他只说：“那边得有人站岗。”",
        "除夕那晚，我在他压箱底的本子里翻到一张折了很多道的纸，画着歪扭的简图：山口、哨塔、雪线。最上面一行铅笔小字已经淡了：“家，在雪线的南边。”",
        "我站在窗前看满城灯火，忽然明白：他站的那道雪线，把我家、把我们这座城、把南边所有亮灯的家，都挡在了风雪的外头。"],
      q:"读完这篇，此刻最贴近你心里的感觉是？",
      opts:[{t:"孤独",r:"你把那座雪山的冷，读到心里去了。"},{t:"牵挂",r:"有个名字，在你想念的时候轻轻冒出来。"},{t:"温暖",r:"有些守候，是隔着雪山也能暖到的。"},{t:"说不清",r:"有些感受，本来就说不清，这就对了。"}],
      read:"“守国门”不是口号，是爸爸一个人站在风雪里望着家的方向。最动人的，是他从不说自己伟大，只画了一条雪线——把守住的，都藏在雪线下面。"},
    {tag:"友",tg:"t-friend",emo:"🧡",title:"一张检讨书",
      intro:"一张检讨书，写着两个人的名字。青春里最好的朋友，是肯替你扛的那一个。",
      paras:["周五放学，我弄脏了黑板报。下周一就要评比，我吓得整晚没睡好，一早冲进教室想偷偷擦掉。",
        "推门却愣住了——班长正站在黑板前，用粉笔把花边一点点描好。他回头看见我，笑着说：“我以为是值日生弄的，顺手补上了。”",
        "后来我才知道，是同桌先发现我的窘迫。他没说破，趁没人时自己把弄脏的地方补好，只求评比前别让我难堪。",
        "那周黑板报拿了奖。全班都在欢呼，只有我，一直记得那张被悄悄补好的花边。"],
      q:"读完这篇，此刻最贴近你心里的感觉是？",
      opts:[{t:"感动",r:"有个人肯替你圆场，还不说破。"},{t:"愧疚",r:"也许你想起某个，没来得及说谢谢的人。"},{t:"温暖",r:"这是青春里最干净的一种善意。"},{t:"说不清",r:"朋友这两个字，本来就该有点说不清。"}],
      read:"最好的友情，常是“我替你圆场，还不让你难堪”。读它时你想起的那张脸，大概就是你真想一直当朋友的人。"},
    {tag:"春",tg:"t-school",emo:"🌸",title:"晚自习的窗",
      intro:"一段没说完的话，一个没说出口的人，都藏在这扇窗里。",
      paras:["晚自习的教室很安静，只有笔尖沙沙。我坐在靠窗的位置，窗外是操场，夏夜的风带来桂花香。",
        "我总在抬头看窗的时候，碰巧也看见她抬头。四目相对半秒，又都低下头假装写作业，其实一个字都没写进去。",
        "毕业前那晚，她在窗台放了一张纸条，只有一行字：“谢谢你每次路过，都朝我笑。”",
        "我攥着纸抬头看窗外——灯还亮着，桂花树影影绰绰。有些话没说出口，却已经传得很远。"],
      q:"读完这篇，此刻最贴近你心里的感觉是？",
      opts:[{t:"心动",r:"那种“四目相对又躲开”的瞬间，太真实了。"},{t:"害羞",r:"有些喜欢，就藏在一扇窗的桂香里。"},{t:"遗憾",r:"青春总有点没说完的话。"},{t:"说不清",r:"说不清就对了，青春本来就说不清。"}],
      read:"最珍贵的，常常不是终于说出口的那句，而是那些“差一点就要说”的瞬间。它干干净净，也让人记一辈子。"}
  ],
  /* —— 第 2 天 —— */
  [
    {tag:"军",tg:"t-home",emo:"🌊",title:"洪峰过境",
      intro:"那年江水漫过我家门槛，有人把我从二楼背到冲锋舟上，没留下名字。",
      paras:["那年夏天的江水，涨得像一头沉默的兽。我站在二楼阳台往下看，水位一天天漫过石阶、漫过花坛、漫过对岸老榆树的根。",
        "最危急那晚，有人把我背上了背。他浑身湿透，作战服的水往下淌，可步子踩得很稳，一步一步把我送上冲锋舟，转身又走回没过腰的洪水里。我叫他“同志——”，他回头朝我点了下头。",
        "那夜街坊挤在安置点。半夜，他和战友端来一大桶热粥，一勺一勺分给老人孩子。我问他叫什么，他摆摆手：“我是解放军。”",
        "水退那天，全镇人去送他们。人们往他们手里塞米汤、塞煮鸡蛋，他们敬了个礼，红了眼眶。"],
      q:"读完这篇，此刻最触动你的是？",
      opts:[{t:"敬佩",r:"把命泡进水里、还不留名，真担得起“敬佩”。"},{t:"感恩",r:"你也想起，某个替陌生人出过手的人。"},{t:"震撼",r:"有些担当，光是读到，就让人心头发紧。"},{t:"说不清",r:"有些东西沉进心里，反而不太能说清。"}],
      read:"“军民鱼水深情”从来不是课本的字，是一个不肯留名的人，把命泡进陌生的水，去护一群和他毫无血缘的家。那一句“我是解放军”，就够了。"},
    {tag:"侠",tg:"t-jx",emo:"🗡️",title:"最后一把刀",
      intro:"一个退隐的刀客，为护一个不相识的孩子，出了最后一刀。",
      paras:["阿刀在镇上开了三年面馆，没人再见他动过刀——除了切面。镇上人都叫他“老面”。",
        "那日两个山匪闯进镇，踹翻了孩子的面摊。孩子跌倒在地，眼看就要挨那一下。老面端面的手停了停，看了看自己沾满面粉的手。",
        "他放下碗，慢慢走过去，说：“那孩子，是老面的客人。”话音未落，他抽刀——不是腰间的，是案上那把砍面的刀。刀光一晃，山匪的刀落了地。",
        "他把刀放回案上，继续揉面，跟没事人一样。只是那天起，镇上的人都明白：老面不只会做面，还护得住人。"],
      q:"读完这篇，此刻你心里的感觉是？",
      opts:[{t:"畅快",r:"看他把刀放下又拾起，那种分量，真畅快。"},{t:"敬佩",r:"侠就是——有本事，却只愿安分守一碗面。"},{t:"热血",r:"那一刀，是为护人才出的。"},{t:"说不清",r:"有些英雄，是藏在面馆里的。"}],
      read:"真正的“侠”，不在刀刃，而在一个退隐者心里。他护的不是名，是“孩子不该挨那一下”的念头。江湖的尽头，往往是平常人的手。"},
    {tag:"友",tg:"t-friend",emo:"🌧️",title:"一把伞的事",
      intro:"那场雨，让两个从没说过话的人，成了朋友。",
      paras:["放学忽然下起大雨，我站在教学楼门口发愁——没带伞。",
        "他举着伞路过，顿了顿，把伞往我这边倾了倾：“顺路吗？”",
        "我嘴上说顺路，其实我家在相反方向。伞不大，他的肩很快湿透。我没敢说，他也假装没懂。",

}
function renderRead(){
  const b=curBook, ch=b.chapters[curChI], last=b.chapters.length-1;
  document.getElementById('readTitle').textContent=b.title;
  S.progress=S.progress||{}; S.progress[b.id]={ch:curChI,para:curPar}; save();
  const slice=ch.paras.slice(curPar,curPar+3);
  document.getElementById('readshell').innerHTML=
    `<div class="rk">第${curChI+1}章 · ${ch.t}</div><h2>${b.title}</h2><div class="au2">${b.author}</div>`+
    slice.map(p=>`<div class="para">${p}</div>`).join('');
  const lastPage=curPar+3>=ch.paras.length;
  const nav=document.getElementById('readNav');
  nav.innerHTML=`<div style="display:flex;gap:10px"><button class="navbtn ghost" onclick="prevPage()">← 上一页</button>${(curChI===last&&lastPage)?'<button class="navbtn gold" onclick="finishBook()">读到最后啦</button>':'<button class="navbtn gold" onclick="nextPage()">下一页 →</button>'}</div>`;
}
function nextPage(){
  const b=curBook, ch=b.chapters[curChI], last=b.chapters.length-1;
  if(curPar+3<ch.paras.length){ curPar+=3; renderRead(); }
  else if(curChI<last){ curChI++; curPar=0; renderRead(); }
  else { finishBook(); }
}
function prevPage(){
  if(curPar>0){ curPar=Math.max(0,curPar-3); renderRead(); }
  else if(curChI>0){ curChI--; curPar=0; renderRead(); }
}
function finishBook(){
  S.progress=S.progress||{}; S.progress[curBook.id]={ch:curChI,para:0,done:true}; save();
  document.getElementById('readTitle').textContent=curBook.title;
  document.getElementById('readshell').innerHTML=`<div style="text-align:center;padding:26px 0"><div style="font-size:34px">📖</div><h2>《${curBook.title}》读完了</h2><p style="color:var(--muted);margin-top:8px">又读完一本，好样的。</p></div>`;
  document.getElementById('readNav').innerHTML=`<div style="display:flex;gap:10px"><button class="navbtn ghost" onclick="restartBook()">再读一遍</button><button class="navbtn gold" onclick="backToList()">回书架</button></div>`;
}
function restartBook(){ curChI=0; curPar=0; renderRead(); }
function toggleToc(){
  const box=document.getElementById('tocBox');
  if(box.style.display==='block'){ box.style.display='none'; return; }
  const b=curBook;
  box.innerHTML=`<div style="font-size:12px;letter-spacing:1px;color:var(--muted);margin-bottom:6px;">📖 目录 · ${b.title}</div>`+
    b.chapters.map((c,i)=>{
      const cur=(i===curChI);
      const p=S.progress&&S.progress[b.id];
      const done=(p&&((p.ch>i)||(p.ch===i&&p.done)));
      return `<div class="toc-item${cur?' cur':''}" onclick="jumpChapter(${i})"><span>${c.t}</span><span class="p">${cur?'正在读':(done?'✓ 已读':'')}</span></div>`;
    }).join('')+
    (S.progress&&S.progress[b.id]&&S.progress[b.id].done?'<div style="font-size:12px;color:var(--green);margin-top:6px;">✓ 全书已读完</div>':'');
  box.style.display='block';
}
function jumpChapter(i){ curChI=i; curPar=0; document.getElementById('tocBox').style.display='none'; renderRead(); }
/* ============ 书架口味 → 今晚推荐 ============ */
function shelfHintType(){
  const kw=[
    ['冒险奇幻',['冒险','奇幻','魔法','哈利','宝','神秘']],
    ['青春校园',['校园','青春','同学','同桌','学校']],
    ['推理悬疑',['推理','悬疑','侦探','破案','案件','谜']],
    ['科幻冒险',['科幻','未来','机器人','外星','宇宙']],
    ['温暖治愈',['温暖','治愈','感动','暖']],
    ['动物世界',['动物','狼','狗','猫','战象']],
    ['历史故事',['历史','明朝','古代','将军','史记']],
    ['成长故事',['成长','长大','坚持','努力']]
  ];
  const texts=(S.shelf||[]).map(b=>b.name).concat(S.likes||[]);
  for(const [t,keys] of kw){ if(texts.some(s=>keys.some(k=>s.includes(k)))) return t; }
  return null;
}
function renderShelfAuto(){
  const t=shelfHintType();
  if(!t)return;
  showBooks(t);
  const box=document.getElementById('bookBox');
  if(box) box.insertAdjacentHTML('afterbegin','<div class="tip" style="color:var(--warm)">📌 根据你的书架/口味，先给你推荐这一类：</div>');
}
/* 足迹数据 */
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function streakDays(){
  let n=0; const d=new Date();
  for(let i=0;i<365;i++){
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(S.days&&S.days[k]){n++;d.setDate(d.getDate()-1);}else{break;}
  }
  return n;
}
function renderFoot(){
  const el=document.getElementById('footprint'); if(!el)return;
  const tk=todayKey();
  const todayN=(S.days&&S.days[tk])||0;
  const likes=(S.likes&&S.likes.length)?S.likes.slice(-4).join('、'):'还没记下～输入几次就有啦';
  el.innerHTML=`<div style="font-size:12px;letter-spacing:2px;color:var(--gold);margin-bottom:8px;">📊 我的足迹</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:14px;">
      <span>累计读过 <b style="color:var(--warm)">${S.totalRead||0}</b> 篇</span>
      <span>不同文章 <b style="color:var(--warm)">${S.read.length}</b> 篇</span>
      <span>连续 <b style="color:var(--warm)">${streakDays()}</b> 天</span>
      <span>今天 <b style="color:var(--warm)">${todayN}</b> 篇</span>
    </div>
    <div class="tip" style="margin-top:6px;">记下的口味：${likes}</div>`;
}
/* 推荐类型按钮 */
function renderTypes(){
  const row=document.getElementById('typeRow');row.innerHTML='';
  TYPES.forEach(t=>{
    const b=document.createElement('button');b.className='type-btn';b.textContent=t;
    b.onclick=()=>{showBooks(t,b);};
    row.appendChild(b);
  });
}
function showBooks(type,btn){
  document.querySelectorAll('.type-btn').forEach(x=>x.classList.remove('sel'));
  if(btn)btn.classList.add('sel');
  const box=document.getElementById('bookBox');box.innerHTML='';
  const list=BOOKS[type]||BOOKS['全推荐'];
  box.innerHTML='<div class="tip">喜欢“'+type+'”的话，这些书可以试试：</div>'+list.map(b=>`<div class="book"><div class="bn">${b.n}</div><div class="bd">${b.d}</div></div>`).join('');
}
/* 自由输入推荐：按关键词匹配类型，并把阿智的口味记下来 */
function recoByInput(){
  const box=document.getElementById('bookBox');
  const inp=document.getElementById('prefInput');
  const v=(inp?inp.value:'').trim();
  if(v){
    S.likes=S.likes||[];
    S.likes.push(v); if(S.likes.length>8)S.likes=S.likes.slice(-8);
    save();
  }
  let type='全推荐';
  if(v){
    const map=[
      ['冒险奇幻',['冒险','奇幻','魔法','哈利','波特','怪物','神秘','宝']],
      ['青春校园',['校园','青春','同学','同桌','学校','班里']],
      ['推理悬疑',['推理','悬疑','破案','侦探','案件','悬念','谜']],
      ['科幻冒险',['科幻','未来','机器人','外星','宇宙','科学']],
      ['温暖治愈',['温暖','治愈','感动','难过','暖心','治愈']],
      ['动物世界',['动物','狼','狗','猫','恐龙','战象']],
      ['历史故事',['历史','朝代','古代','将军','明朝','史记']],
      ['成长故事',['成长','长大','努力','坚持','奋斗']]
    ];
    for(const m of map){ if(m[1].some(k=>v.includes(k))){ type=m[0]; break; } }
  }
  showBooks(type);
  if(v){ box.insertAdjacentHTML('afterbegin','<div class="tip" style="color:var(--gold)">✏️ 已记下：'+v+' —— 以后给你的文章和书，会往这个口味靠。</div>'); }
}
/* ---------- 阅读 ---------- */
let cur=null;
function openStory(s){
  cur=s;
  show('s-read');
  document.getElementById('crumbTag').textContent=s.emo+' '+s.tag+' · '+s.title;
  document.getElementById('sheet').innerHTML=`<div class="stline">${s.emo} ${s.tag}</div><h2>${s.title}</h2>${s.paras.map(p=>`<div class="para">${p}</div>`).join('')}<button class="finish" onclick="finishStory()">读完了 · 说点心里话</button>`;
  document.getElementById('interactBox').innerHTML='';
}
function finishStory(){
  const s=cur;
  // 记录：读过 + 累计 + 日期
  if(!S.read.includes(s.title)){S.read.push(s.title);}
  S.totalRead=(S.totalRead||0)+1;
  const d=todayKey(); S.days=S.days||{}; S.days[d]=(S.days[d]||0)+1;
  save();
  // 互动：情感把握（非对错）
  document.getElementById('interactBox').innerHTML=
    `<div class="interact"><div class="k">✿ 读完这篇，此刻最贴近你心里的感觉是？</div>
     <div class="q">${s.q}</div>
     ${s.opts.map((o,i)=>`<button class="em" onclick="pickEmotion(this,${i})">${o.t}</button>`).join('')}
     <div id="emReply"></div>
     <div class="reading" id="readBlock" style="display:none"><b style="color:var(--warm)">一段小解读：</b><br>${s.read}</div>
     <div class="tip" style="margin-top:10px" id="nextTip"></div></div>`;
}
function pickEmotion(btn,i){
  const o=cur.opts[i];
  document.querySelectorAll('.em').forEach(x=>{x.style.borderColor='';x.style.background='';});
  btn.style.borderColor='var(--gold)';btn.style.background='#f3ead6';
  document.getElementById('emReply').innerHTML=`<div class="reply"><b>${o.r}</b></div>`;
  document.getElementById('readBlock').style.display='block';
  document.getElementById('nextTip').innerHTML='<span class="home-link" onclick="backToList()">读完啦，回去看看今天还有没有想读的 →</span>';
}
function backToList(){show('s-list');renderList();}

/* 初始化 */
renderList();
</script>
</body>
